# Spear Attribute Swap Fixer​‌‌​​​‌​​‌‌‌‌​​‌​​‌​​​​​​‌‌​​‌​‌​‌‌‌‌​‌​​‌‌‌​​‌​​‌‌​​​​‌​​‌​‌‌‌‌​‌‌​‌‌‌​​‌‌​​​​‌​‌‌‌​‌​​​‌‌​​​​‌​‌‌​‌‌‌​
# Swipe hotbar to a spear -> zero attack cooldown. No swipe -> vanilla cooldown.

enabled: true

# Each swipe to a spear gives ONE free jab/lunge. This is how long (ticks, 20 = 1s) the free jab stays
# available after the swipe if it is not used. 0 = until used or the player swipes away.
zero-cooldown-ticks: 40

# Temporary attack-speed bonus sent to the client so the spear jab/lunge is never on cooldown.
# Needs to be large (the game caps attack speed at 1024). Do not set to 0.
attack-speed-boost: 1000

# Also trigger when swapping with the offhand key
hand-swap-triggers: false

# Only spears with the Lunge enchantment count
lunge-only: false
