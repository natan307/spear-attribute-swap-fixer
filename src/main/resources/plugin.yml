name: SpearAttributeSwapFixer
version: '2.3.1'
main: id.ezra.spearswap.SpearSwapFixerPlugin
api-version: '1.21'
description: "SpearAttributeSwapFixer - zero cooldown spear after a hotbar swipe"
commands:
  spearswapfixer:
    description: Toggle the spear swipe fixer on/off
    aliases: [ssf, spearswarpfixer]
    permission: spearswapfixer.use
permissions:
  spearswapfixer.use:
    description: Allows toggling SpearAttributeSwapFixer
    default: op
